<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translation Tool</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">

        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-white text-center">

            <h1 class="text-2xl font-bold flex items-center justify-center gap-3">
                <i class="fa-solid fa-language text-3xl"></i>
                Language Translation Tool
            </h1>

            <p class="text-blue-100 text-sm mt-1">
                Translate text seamlessly across languages
            </p>

        </div>


        <!-- Main Body -->
        <div class="p-6 space-y-6">

            <!-- Language Selectors -->
            <div class="grid grid-cols-1 md:grid-cols-11 gap-4 items-center">

                <!-- Source Language -->
                <div class="md:col-span-5">

                    <label
                        class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2"
                    >
                        From
                    </label>

                    <select
                        id="sourceLang"
                        class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >

                        <option value="auto" selected>
                            Auto Detect Language
                        </option>

                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="zh">Chinese</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="hi">Hindi</option>
                        <option value="mr">Marathi</option>
                        <option value="gu">Gujarati</option>
                        <option value="ta">Tamil</option>
                        <option value="te">Telugu</option>
                        <option value="ar">Arabic</option>
                        <option value="ru">Russian</option>

                    </select>

                </div>


                <!-- Swap Button -->
                <div class="md:col-span-1 flex justify-center pt-6">

                    <button
                        id="swapBtn"
                        class="bg-slate-100 hover:bg-slate-200 text-slate-600 p-3 rounded-full shadow-sm transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        title="Swap languages"
                    >

                        <i class="fa-solid fa-arrows-left-right hidden md:block"></i>

                        <i class="fa-solid fa-arrows-up-down md:hidden"></i>

                    </button>

                </div>


                <!-- Target Language -->
                <div class="md:col-span-5">

                    <label
                        class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2"
                    >
                        To
                    </label>

                    <select
                        id="targetLang"
                        class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >

                        <option value="en">English</option>
                        <option value="es" selected>Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="zh">Chinese</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="hi">Hindi</option>
                        <option value="mr">Marathi</option>
                        <option value="gu">Gujarati</option>
                        <option value="ta">Tamil</option>
                        <option value="te">Telugu</option>
                        <option value="ar">Arabic</option>
                        <option value="ru">Russian</option>

                    </select>

                </div>

            </div>


            <!-- Text Areas -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Source Text -->
                <div
                    class="flex flex-col border border-slate-200 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-blue-500 transition-shadow"
                >

                    <textarea
                        id="sourceText"
                        placeholder="Type or paste your text here..."
                        class="w-full h-56 p-4 resize-none border-none text-slate-800 placeholder-slate-400 focus:outline-none text-lg"
                        maxlength="2000"
                    ></textarea>


                    <!-- Input Actions -->
                    <div
                        class="bg-slate-50 px-4 py-3 flex justify-between items-center border-t border-slate-100"
                    >

                        <button
                            id="speakSource"
                            class="text-slate-400 hover:text-blue-600 p-2 rounded transition-colors"
                            title="Listen to text"
                        >
                            <i class="fa-solid fa-volume-high"></i>
                        </button>

                        <span
                            id="charCount"
                            class="text-xs text-slate-400 font-medium"
                        >
                            0 / 2000
                        </span>

                    </div>

                </div>


                <!-- Target Text -->
                <div
                    class="flex flex-col border border-slate-200 rounded-xl overflow-hidden bg-slate-50"
                >

                    <div
                        id="targetText"
                        class="w-full h-56 p-4 text-slate-800 text-lg overflow-y-auto select-text whitespace-pre-wrap"
                    >
                        <span class="text-slate-400">
                            Translation will appear here...
                        </span>
                    </div>


                    <!-- Output Actions -->
                    <div
                        class="bg-slate-100 px-4 py-3 flex justify-between items-center border-t border-slate-200"
                    >

                        <div class="flex gap-2">

                            <button
                                id="copyBtn"
                                class="text-slate-400 hover:text-blue-600 p-2 rounded transition-colors"
                                title="Copy Translation"
                            >
                                <i class="fa-solid fa-copy"></i>
                            </button>


                            <button
                                id="speakTarget"
                                class="text-slate-400 hover:text-blue-600 p-2 rounded transition-colors"
                                title="Listen to Translation"
                            >
                                <i class="fa-solid fa-volume-high"></i>
                            </button>

                        </div>


                        <span
                            id="statusLabel"
                            class="text-xs font-semibold text-slate-400"
                        >
                            READY
                        </span>

                    </div>

                </div>

            </div>


            <!-- Error Message -->
            <div
                id="errorMessage"
                class="hidden bg-red-50 text-red-600 border border-red-200 rounded-lg p-3 text-sm"
            >
            </div>


            <!-- Translate Button -->
            <div class="text-center pt-2">

                <button
                    id="translateBtn"
                    class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3.5 rounded-xl shadow-lg shadow-blue-500/20 active:scale-[0.98] transition-all duration-150 focus:outline-none focus:ring-4 focus:ring-blue-300"
                >

                    <span id="btnText">
                        Translate Text
                    </span>

                    <i
                        class="fa-solid fa-arrow-right ml-2"
                        id="btnIcon"
                    ></i>

                </button>

            </div>

        </div>


        <!-- Footer -->
        <div class="text-center border-t border-slate-100 p-4">

            <p class="text-xs text-slate-400">
                Language Translation Tool • Built with HTML, CSS & JavaScript
            </p>

        </div>

    </div>


<script>

    // ==========================================
    // DOM ELEMENTS
    // ==========================================

    const sourceText = document.getElementById("sourceText");
    const targetText = document.getElementById("targetText");

    const sourceLang = document.getElementById("sourceLang");
    const targetLang = document.getElementById("targetLang");

    const translateBtn = document.getElementById("translateBtn");

    const btnText = document.getElementById("btnText");
    const btnIcon = document.getElementById("btnIcon");

    const statusLabel = document.getElementById("statusLabel");

    const swapBtn = document.getElementById("swapBtn");

    const charCount = document.getElementById("charCount");

    const copyBtn = document.getElementById("copyBtn");

    const speakSource = document.getElementById("speakSource");
    const speakTarget = document.getElementById("speakTarget");

    const errorMessage = document.getElementById("errorMessage");


    // ==========================================
    // CHARACTER COUNTER
    // ==========================================

    sourceText.addEventListener("input", () => {

        charCount.textContent =
            `${sourceText.value.length} / 2000`;

        errorMessage.classList.add("hidden");

    });


    // ==========================================
    // SHOW ERROR
    // ==========================================

    function showError(message) {

        errorMessage.textContent = message;

        errorMessage.classList.remove("hidden");

        statusLabel.textContent = "ERROR";

        statusLabel.classList.remove(
            "text-slate-400",
            "text-green-500"
        );

        statusLabel.classList.add("text-red-500");

    }


    // ==========================================
    // TRANSLATE TEXT
    // ==========================================

    async function translateText() {

        const text = sourceText.value.trim();

        if (!text) {

            showError("Please enter some text to translate.");

            return;

        }


        if (sourceLang.value === targetLang.value) {

            targetText.textContent = text;

            statusLabel.textContent = "COMPLETED";

            return;

        }


        // Loading state

        translateBtn.disabled = true;

        btnText.textContent = "Translating...";

        btnIcon.className =
            "fa-solid fa-spinner fa-spin ml-2";

        statusLabel.textContent = "TRANSLATING...";

        statusLabel.classList.remove(
            "text-red-500",
            "text-green-500"
        );

        statusLabel.classList.add("text-blue-500");

        errorMessage.classList.add("hidden");


        try {

            /*
                MyMemory Translation API

                This is used for a simple frontend demo.
            */

            let source = sourceLang.value;

            /*
                MyMemory does not use "auto".
                For auto-detection we use "en" as a fallback.
            */

            if (source === "auto") {
                source = "en";
            }


            const url =
                "https://api.mymemory.translated.net/get?" +
                "q=" + encodeURIComponent(text) +
                "&langpair=" +
                encodeURIComponent(source) +
                "|" +
                encodeURIComponent(targetLang.value);


            const response = await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "Translation service is unavailable."
                );

            }


            const data = await response.json();


            if (
                data.responseData &&
                data.responseData.translatedText
            ) {

                targetText.textContent =
                    data.responseData.translatedText;


                statusLabel.textContent = "COMPLETED";

                statusLabel.classList.remove(
                    "text-blue-500",
                    "text-red-500"
                );

                statusLabel.classList.add(
                    "text-green-500"
                );

            } else {

                throw new Error(
                    "No translation was returned."
                );

            }

        } catch (error) {

            console.error(error);

            showError(
                "Translation failed. Please check your internet connection and try again."
            );

            targetText.innerHTML =
                '<span class="text-red-400">Translation unavailable.</span>';

        } finally {

            translateBtn.disabled = false;

            btnText.textContent = "Translate Text";

            btnIcon.className =
                "fa-solid fa-arrow-right ml-2";

        }

    }


    // ==========================================
    // TRANSLATE BUTTON
    // ==========================================

    translateBtn.addEventListener(
        "click",
        translateText
    );


    // ==========================================
    // SWAP LANGUAGES
    // ==========================================

    swapBtn.addEventListener("click", () => {

        if (sourceLang.value === "auto") {

            showError(
                "Auto Detect cannot be swapped. Please select a specific source language."
            );

            return;

        }


        const oldSourceLanguage =
            sourceLang.value;

        const oldTargetLanguage =
            targetLang.value;


        sourceLang.value =
            oldTargetLanguage;

        targetLang.value =
            oldSourceLanguage;


        const translated =
            targetText.textContent;


        const original =
            sourceText.value;


        if (
            translated &&
            translated !==
            "Translation will appear here..."
        ) {

            sourceText.value =
                translated;

        } else {

            sourceText.value =
                original;

        }


        if (original) {

            targetText.textContent =
                original;

        }


        charCount.textContent =
            `${sourceText.value.length} / 2000`;

        statusLabel.textContent =
            "READY";

        statusLabel.className =
            "text-xs font-semibold text-slate-400";

    });


    // ==========================================
    // COPY TRANSLATION
    // ==========================================

    copyBtn.addEventListener(
        "click",
        async () => {

            const text =
                targetText.textContent.trim();


            if (
                !text ||
                text ===
                "Translation will appear here..."
            ) {

                showError(
                    "There is no translated text to copy."
                );

                return;

            }


            try {

                await navigator.clipboard.writeText(text);


                const oldIcon =
                    copyBtn.innerHTML;


                copyBtn.innerHTML =
                    '<i class="fa-solid fa-check text-green-500"></i>';


                setTimeout(() => {

                    copyBtn.innerHTML =
                        oldIcon;

                }, 2000);


            } catch (error) {

                console.error(error);

                showError(
                    "Unable to copy the translation."
                );

            }

        }
    );


    // ==========================================
    // TEXT TO SPEECH
    // ==========================================

    function handleSpeech(text, language) {

        if (!text) {

            showError(
                "There is no text to read."
            );

            return;

        }


        if (!window.speechSynthesis) {

            showError(
                "Text-to-speech is not supported in this browser."
            );

            return;

        }


        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(text);


        /*
            Browser speech language codes
        */

        const speechLanguages = {

            en: "en-US",

            es: "es-ES",

            fr: "fr-FR",

            de: "de-DE",

            it: "it-IT",

            pt: "pt-PT",

            zh: "zh-CN",

            ja: "ja-JP",

            ko: "ko-KR",

            hi: "hi-IN",

            mr: "mr-IN",

            gu: "gu-IN",

            ta: "ta-IN",

            te: "te-IN",

            ar: "ar-SA",

            ru: "ru-RU"

        };


        utterance.lang =
            speechLanguages[language] ||
            "en-US";


        utterance.rate = 0.9;

        utterance.pitch = 1;


        window.speechSynthesis.speak(
            utterance
        );

    }


    // Source speech

    speakSource.addEventListener(
        "click",
        () => {

            handleSpeech(
                sourceText.value,
                sourceLang.value === "auto"
                    ? "en"
                    : sourceLang.value
            );

        }
    );


    // Target speech

    speakTarget.addEventListener(
        "click",
        () => {

            const text =
                targetText.textContent.trim();


            if (
                !text ||
                text ===
                "Translation will appear here..."
            ) {

                showError(
                    "There is no translated text to read."
                );

                return;

            }


            handleSpeech(
                text,
                targetLang.value
            );

        }
    );


</script>

</body>
</html>
